name: Release

on:
  push:
    tags:
      - 'panel-v*'

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Create release
        run: gh release create ${{ github.ref_name }} --generate-notes --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: create-release
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win

    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and package
        run: npm run build && npm run pack -- --${{ matrix.platform }} --publish never

      - name: Upload to release
        shell: bash
        run: |
          files=()
          for f in release/*.AppImage release/*.tar.gz release/*.zip release/*.dmg release/*.exe; do
            [ -f "$f" ] && files+=("$f")
          done
          gh release upload ${{ github.ref_name }} "${files[@]}" --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
